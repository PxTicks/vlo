[project]
name = "vlo-backend"
version = "0.2.0"
description = "VLO video editor backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "xxhash",
    "Pillow",
    "httpx",
    "websockets",
    "python-dotenv",
    "numpy",
    "av",
    "torch",
    "torchaudio",
    "einops",
    "soxr",
    "soundfile",
    "rotary-embedding-torch",
    "beat-this",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "anyio",
]

# Input for scripts/sync-backend-requirements.py — NOT an installable extra.
# This is deliberately not under [project.optional-dependencies]: `pip install
# .[test-light]` would still pull the mandatory `dependencies` (torch and the
# rest of the ML stack), the exact trap the CI lane avoids. It is the runtime
# deps the test suite actually exercises, minus that ML stack (torch,
# torchaudio, einops, soxr, rotary-embedding-torch, beat-this); only one test
# needs the stack and it is marked `requires_torch` and deselected in CI. Keep
# in sync with `dependencies` above when a non-ML runtime dep is added, then
# re-run the generator.
[tool.sync-backend-requirements]
test-light = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "xxhash",
    "Pillow",
    "httpx",
    "websockets",
    "python-dotenv",
    "numpy",
    "av",
    "soundfile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
strict_markers = true
strict_config = true
markers = [
    "requires_torch: needs the torch/ML stack (excluded from the default CI lane)",
    "requires_ffmpeg: needs an ffmpeg binary on PATH",
]
# The last matching filter wins, so the broad "default" must come first and the
# specific escalation after it.
filterwarnings = [
    "default",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "assets/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
