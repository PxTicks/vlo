name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Catalogue extension contract impact
      id: extension-impact
      working-directory: .
      env:
        EXTENSION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        EXTENSION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: >-
        node scripts/check-extension-surface.mjs
        --base "$EXTENSION_BASE_SHA"
        --head "$EXTENSION_HEAD_SHA"
        --github

    - name: Test extension surface catalogue
      working-directory: .
      run: npm run test:extension-surface

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test with coverage
      run: npm run test:coverage

    - name: Upload frontend coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage
        if-no-files-found: error

    - name: Build
      run: npm run build

    # This build sets no VITE_E2E_DIAGNOSTICS, so it is a release bundle.
    # Assert the E2E-only export probe was tree-shaken out — the guarantee that
    # makes it acceptable production source. A refactor turning the build-time
    # gate into a runtime check would fail here rather than shipping.
    - name: Verify no E2E affordances in release bundle
      run: npm run verify:bundle

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        # Match the developer venv (3.14). If a wheel (e.g. av, soundfile) turns
        # out to be missing for 3.14 on the runner, fall back to "3.12" and note
        # why here rather than letting CI and dev silently diverge.
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-test.txt

    # The requirements files (including the requirements-test.txt this job
    # installs) are generated from pyproject.toml. Fail fast if someone changed
    # the deps without regenerating, so the declared source of truth and the CI
    # environment cannot silently diverge. Uses stdlib only, so it runs before
    # any install.
    - name: Verify generated requirements are in sync
      run: |
        python3 scripts/sync-backend-requirements.py
        git diff --exit-code -- \
          backend/requirements.txt \
          backend/requirements-dev.txt \
          backend/requirements-test.txt

    # ffmpeg un-skips the one audio-fixture test (requires_ffmpeg); without it
    # that test would silently skip and provide no signal.
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    # Install the generated lightweight set, NOT `-e ./backend[...]`: an editable
    # install would also pull the mandatory dependencies (torch and the rest of
    # the ML stack). `pythonpath = ["."]` in backend/pyproject.toml makes the
    # backend importable without installing the package at all.
    - name: Install backend test dependencies
      run: pip install -r backend/requirements-test.txt

    # Run from backend/ so pytest picks up its config and coverage discovers the
    # [tool.coverage.*] config (both live in backend/pyproject.toml). The one
    # torch-dependent test is deselected; every other test runs.
    - name: Run backend tests
      working-directory: backend
      run: |
        python -m pytest \
          -m "not requires_torch" \
          --cov --cov-report=term-missing --cov-report=xml

    - name: Upload backend coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage.xml
        if-no-files-found: error
