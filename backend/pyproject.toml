[project]
name = "vlo-backend"
version = "0.2.0"
description = "VLO video editor backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "xxhash",
    "Pillow",
    "httpx",
    "websockets",
    "python-dotenv",
    "numpy",
    "av",
    "torch",
    "torchaudio",
    "einops",
    "soxr",
    "soundfile",
    "rotary-embedding-torch",
    "beat-this",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
strict_markers = true
strict_config = true
markers = [
    "requires_torch: needs the torch/ML stack (excluded from the default CI lane)",
    "requires_ffmpeg: needs an ffmpeg binary on PATH",
]
# The last matching filter wins, so the broad "default" must come first and the
# specific escalation after it.
filterwarnings = [
    "default",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "assets/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
